# dataset
#data_dir: '/data/datasets/DVS/DVS_Cifar10/CIFAR10DVS/'
data_dir: '/mnt/data/datasets'  # 131
dataset: dvsc10
num_classes: 10
event_size: 64

#data augmentation
color_jitter: 0.
interpolation: bicubic
train_interpolation: bicubic
aa: rand-m9-n1-mstd0.4-inc1
epochs: 200   #epochs

mixup: 0.5
mixup_off_epoch: 0.  # mixup off
mixup_prob: 1.0
mixup_mode: batch
mixup_switch_prob: 0.5
cutmix: 0.0
reprob: 0.25
remode: const

# model structure
model: "TIMv2_bl_TIMv1_dvs"
step: 10
in_channels: 2
embed_dim: 256
num_heads: 16
depths: 2


# train hyperparam
amp: True
batch_size: 32
val_batch_size: 32
lr: 7.5e-3
min_lr: 3e-4
sched: cosine
weight_decay: 1e-4
cooldown_epochs: 10
warmup_epochs: 10
warmup_lr: 1e-3
opt: adamw
smoothing: 0.1
workers: 8
seed: 42
log_interval: 200

# log dir
output: "/mnt/home/shensicheng/log/TEFormer/baseline/dvsc10/"

# device
device: 3


